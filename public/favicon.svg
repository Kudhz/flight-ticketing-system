<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bg-grad" x1="4" y1="4" x2="60" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0D192B" />
      <stop offset="52%" stop-color="#132A46" />
      <stop offset="100%" stop-color="#0D4B56" />
    </linearGradient>
    <linearGradient id="accent-grad" x1="12" y1="14" x2="52" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2DD4BF" />
      <stop offset="100%" stop-color="#0D9488" />
    </linearGradient>
    <linearGradient id="plane-grad" x1="16" y1="16" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#CCFBF1" />
    </linearGradient>
    <filter id="glow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0D9488" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Rounded Squircle Ticket Badge -->
  <rect x="4" y="4" width="56" height="56" rx="16" fill="url(#bg-grad)" stroke="url(#accent-grad)" stroke-width="2" />

  <!-- Subtle Radar / Flight Arc -->
  <path
    d="M13 46C20 30 33 21 50 18"
    stroke="url(#accent-grad)"
    stroke-width="2.2"
    stroke-linecap="round"
    stroke-dasharray="3 4"
    opacity="0.7"
  />

  <!-- Origin Dot -->
  <circle cx="14" cy="46" r="3.2" fill="#2DD4BF" />
  <circle cx="14" cy="46" r="6" fill="#2DD4BF" opacity="0.22" />

  <!-- Stylized Aircraft Silhouette -->
  <g filter="url(#glow)">
    <path
      d="M48.8 16.4C47.5 15.1 45.1 15.6 43.3 17.4L36.8 23.9L20.6 19.8C19.6 19.5 18.6 19.9 18 20.6L16.7 21.9C16.1 22.5 16.3 23.6 17.1 24.1L29.6 31.1L23.8 36.9L17.6 35.7C16.9 35.5 16.1 35.8 15.6 36.3L14.6 37.3C14.1 37.8 14.2 38.7 14.9 39.1L21.7 42.9L25.5 49.7C25.9 50.4 26.8 50.5 27.3 50L28.3 49C28.8 48.5 29.1 47.7 28.9 47L27.7 40.8L33.5 35L40.5 47.5C41 48.3 42.1 48.5 42.7 47.9L44 46.6C44.7 46 45.1 45 44.8 44L40.7 27.8L47.2 21.3C49 19.5 49.5 17.1 48.8 16.4Z"
      fill="url(#plane-grad)"
    />
  </g>
</svg>
